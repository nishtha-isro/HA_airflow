# sentinel-2server.conf
# Phase 1: Single sentinel (quorum=1)
# The sentinel watches the redis-primary on the SAME server (localhost / service name)
# When server 3 arrives → add sentinel2 there (quorum changes to 2)
# When server 4 arrives → add sentinel3 there (quorum changes to 2 or 3)

sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Phase 1: redis-primary is on the same Docker network — use service name
sentinel monitor mymaster redis-primary 6379 1

sentinel auth-pass mymaster redispassword
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
