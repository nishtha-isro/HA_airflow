# haproxy-2server.cfg
# Phase 1: Single PostgreSQL backend (pg-node1 on same server)
# Phase 2: Add pg-node2 when server 3 arrives
# Phase 3: Add pg-node3 when server 4 arrives

global
    maxconn 200

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# ── Stats dashboard ──────────────────────────────────────────
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

# ── PostgreSQL entry point ────────────────────────────────────
# Patroni REST API on port 8008 returns 200 only for the leader.
# HAProxy uses this as health check — always routes to the active primary.
listen postgres_primary
    bind *:5432
    option httpchk OPTIONS /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    # Phase 1: Only pg-node1 (port 5433 = Patroni, mapped on same host)
    server pg1 10.61.247.142:5433 maxconn 100 check port 8008

    # Phase 2 (Month 1): Uncomment when server 3 arrives at 10.61.247.XXX
    # server pg2 10.61.247.XXX:5432 maxconn 100 check port 8008

    # Phase 3 (Month 2): Uncomment when server 4 arrives at 10.61.247.YYY
    # server pg3 10.61.247.YYY:5432 maxconn 100 check port 8008
